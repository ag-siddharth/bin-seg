# base config — other configs override specific fields

data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  num_workers: 4
  pin_memory: true

model:
  backbone: resnet50_fpn     # resnet50_fpn or resnet101_fpn
  pretrained: true           # imagenet pretrained backbone
  num_classes: null           # set from dataset, leave null
  box_score_thresh: 0.5
  box_nms_thresh: 0.4
  min_size: 640
  max_size: 1024

training:
  batch_size: 4
  epochs: 30
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: step          # step or cosine
  lr_step_size: 10
  lr_gamma: 0.1
  warmup_epochs: 1
  warmup_factor: 0.001
  grad_clip: null             # set to e.g. 5.0 if you see exploding grads

augmentation:
  horizontal_flip: true
  vertical_flip: false
  color_jitter: true
  color_jitter_brightness: 0.3
  color_jitter_contrast: 0.3
  color_jitter_saturation: 0.2
  color_jitter_hue: 0.05
  random_crop: true
  crop_scale: [0.7, 1.0]
  occlusion_synthesis: true   # paste random patches to simulate occlusion
  occlusion_max_patches: 3
  occlusion_size_range: [0.05, 0.2]   # fraction of image size

loss:
  type: default               # default (cross-entropy) or focal
  focal_alpha: 0.25
  focal_gamma: 2.0

evaluation:
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  score_threshold: 0.5

logging:
  mlflow_tracking_uri: mlruns
  log_interval: 50            # log every N batches
  save_best: true
  save_every: 5               # save checkpoint every N epochs
  output_dir: results
